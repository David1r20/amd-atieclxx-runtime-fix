name: Build portable native Windows app (beta)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native Win64 app
        shell: pwsh
        run: ./native/Build.ps1
      - name: Verify portable executable and hash
        shell: pwsh
        run: |
          $exe = 'dist-native/AMD-atieclxx-Fix-Native.exe'
          if (!(Test-Path $exe)) { throw 'Native executable not generated' }
          $size = (Get-Item $exe).Length
          if ($size -gt 5MB) { throw "Native output is unexpectedly large: $size" }
          Get-FileHash $exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: AMD-atieclxx-Fix-Native-beta-win-x64
          path: dist-native/AMD-atieclxx-Fix-Native.exe
          if-no-files-found: error
          retention-days: 14
