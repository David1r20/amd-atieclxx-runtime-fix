name: Build Windows GUI installer (beta)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile monitor and self-contained GUI
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AMD-atieclxx-Fix-Setup.exe')) {
            throw 'GUI executable was not generated'
          }
          Get-FileHash 'dist/AMD-atieclxx-Fix-Setup.exe' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: amd-atieclxx-setup-beta-win-x64
          path: dist/AMD-atieclxx-Fix-Setup.exe
          if-no-files-found: error
          retention-days: 14
